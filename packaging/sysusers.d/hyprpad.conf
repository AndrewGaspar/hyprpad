# hyprpad — the group that gates the privileged fd broker's socket.
#
# The broker runs as root and hands out descriptors for /dev/uhid and the controller's
# hidraw nodes. Its socket, /run/hyprpad/broker.sock, is created 0660 root:hyprpad
# by hyprpad-broker.socket, so membership of this group is exactly "may ask the
# broker for the controller". Add yourself with:
#
#     sudo usermod -aG hyprpad $USER      # then re-login, or `newgrp hyprpad`
#
# A system group with no members and no user of its own: nothing ever runs *as*
# hyprpad, the group is only ever a filter on who may connect.
#
# INSTALL
#     sudo install -Dm644 packaging/sysusers.d/hyprpad.conf /usr/lib/sysusers.d/hyprpad.conf
#     sudo systemd-sysusers
#
#Type Name     ID  GECOS  Home  Shell
g     hyprpad  -
